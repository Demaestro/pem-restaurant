name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check server
        run: |
          node --check server.js
          node --check lib/checkout.js
          node --check lib/storage.js

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit

      - name: Build
        run: npm run build
